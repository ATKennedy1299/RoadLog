name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship with a preinstalled Android SDK
      # (platforms + build-tools) at $ANDROID_HOME, so no separate
      # SDK-setup action is needed. Just accept licenses and go.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log

      # Log/artifact downloads redirect through Azure Blob Storage, which
      # this project's egress policy can't reach — so post the failure
      # excerpt as a commit comment instead, a plain API object with no
      # blob-storage indirection.
      - name: Post failure log as a commit comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Actions runs each step's script with `bash -e`, so any
          # command here that can exit non-zero (grep with zero matches,
          # in particular) needs `|| true`, or this whole step aborts
          # before curl ever posts anything.
          #
          # Gradle's own "FAILURE: Build failed..." banner + its "What
          # went wrong" section is the most reliable, failure-type-agnostic
          # summary there is — it's what this leads with. The compiler-error
          # grep and raw tail are kept as a fallback/supplement, since a
          # plain tail alone can land mid-stack-trace with the actual
          # message scrolled out of view (as happened here).
          {
            echo "=== Gradle failure summary ==="
            grep -A 40 "FAILURE: Build failed" build-output.log || echo "(no FAILURE banner found)"
            echo "=== Compiler error lines ==="
            grep -E "^e: |error:" build-output.log || echo "(none)"
            echo "=== tail ==="
            tail -n 60 build-output.log
          } > failure-excerpt.txt
          BODY=$(jq -Rs '"### Build failed: " + "${{ github.workflow }}" + "\n```\n" + . + "\n```"' failure-excerpt.txt)
          curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"

      - uses: actions/upload-artifact@v4
        with:
          name: roadlog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
